[vars]
machine = "truenas"

[dotfiles]
"~/.config/mise/mise.truenas.toml" = { source = "~/.dotfiles/mise.truenas.toml", mode = "symlink" }
"~/.zshenv" = { source = "~/.dotfiles/home/zshenv", mode = "symlink" }
"~/.zshrc" = { source = "~/.dotfiles/home/zshrc", mode = "symlink" }

[bootstrap.repos]
# A plain clone, not the official installer: the installer would write its
# own .zshrc over the managed one.
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[tools]
"1password" = "2.35.0"
"age" = "latest"
