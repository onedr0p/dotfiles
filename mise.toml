# `merge` dotfile entries need 2026.10.4 (older releases skip them with a
# warning), and `exclude` on symlink-each entries needs 2026.7.16 (older releases
# ignore it silently and deploy the excluded files).
min_version = "2026.10.4"

[settings]
experimental = true

# `machine` is defined only in the mise.<machine>.toml overlays (selected via
# MISE_ENV, pinned once in ~/.config/mise/miserc.toml); defining it here too
# would override the overlay when loaded from the global config dir. Git
# identity can be overridden locally in an untracked mise.local.toml.
[vars]
git_name = "Devin Buhl"
git_email = "devin@buhl.casa"

# home/config mirrors ~/.config exactly. Template sources live alongside their
# rendered targets and are kept out of symlink-each by `exclude`, which needs
# mise 2026.7.16 (see min_version). Per-machine homebrew files stay in
# home/<machine>/ because fedora and macos each need a different brewfile at the
# same ~/.config/homebrew path.
[dotfiles]
"~/.config" = { source = "~/.dotfiles/home/config", mode = "symlink-each", exclude = ["*.tmpl"] }
"~/.config/fish/functions/ms.fish" = { source = "~/.dotfiles/home/config/fish/functions/ms.fish.tmpl", mode = "template" }
"~/.config/fish/functions/tf.fish" = { source = "~/.dotfiles/home/config/fish/functions/tf.fish.tmpl", mode = "template" }
"~/.gitconfig" = { source = "~/.dotfiles/home/gitconfig.tmpl", mode = "template" }
"~/.gitignore_global" = { source = "~/.dotfiles/home/gitignore_global", mode = "symlink" }
"~/.nanorc" = { source = "~/.dotfiles/home/nanorc", mode = "symlink" }
"~/.ssh/config" = { source = "~/.dotfiles/home/ssh/config.tmpl", mode = "template" }
"~/.ssh/allowed_signers" = { source = "~/.dotfiles/home/ssh/allowed_signers", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "~/.dotfiles/home/config/agents/AGENTS.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "~/.dotfiles/home/config/agents/AGENTS.md", mode = "symlink" }
# Claude Code rewrites this file when settings change via /config, so merge only
# the keys in the source; model, plugins and the rest it writes stay per machine.
"~/.claude/settings.json/shared" = { source = "~/.dotfiles/home/claude/settings.json", merge = true }
# codex persists machine-local state into config.toml (per-project trust_level,
# notice.*, tui.*), so merge only the keys in the source. It is a template
# because the Go build cache path differs per OS.
"~/.codex/config.toml/shared" = { source = "~/.dotfiles/home/codex/config.toml", merge = true, template = "tera" }
# Each mise.<machine>.toml overlay symlinks only itself into ~/.config/mise,
# so hosts don't carry (and warn about) the other machines' overlays.
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise.toml", mode = "symlink" }

[bootstrap.repos]
"~/.nano" = { url = "https://github.com/scopatz/nanorc.git" }

# Bootstraps fisher and syncs the managed plugin list. Runs after [tools], so
# fish already exists (brew on macos, mise on truenas). No fish means no
# plugins to manage (termux), so skip.
[tasks.bootstrap]
run = '''
set -eu
FISH="$(command -v fish || true)"
for candidate in /opt/homebrew/bin/fish /usr/local/bin/fish "$HOME/.local/share/mise/shims/fish"; do
    [ -n "$FISH" ] && break
    [ -x "$candidate" ] && FISH="$candidate"
done
[ -n "$FISH" ] || exit 0
if "$FISH" -c 'functions -q fisher' 2>/dev/null; then
    "$FISH" -c 'fisher update'
else
    "$FISH" -c 'curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher update'
fi
'''
